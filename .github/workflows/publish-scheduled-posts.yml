# Rebuilds the GitHub Pages site every morning so future-dated posts
# publish automatically on their scheduled date. Also runnable manually
# from the Actions tab ("Run workflow") to publish immediately.
name: Publish scheduled posts
on:
  schedule:
    - cron: "0 12 * * *"   # 12:00 UTC ≈ 8:00 AM Eastern (7:00 AM in winter)
  workflow_dispatch:
permissions:
  pages: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Request a GitHub Pages build
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages/builds
